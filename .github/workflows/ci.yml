name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  foundation:
    name: Foundation check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Required repo files present
        run: |
          set -e
          for f in README.md LICENSE CONTRIBUTING.md CODE_OF_CONDUCT.md; do
            if [ ! -f "$f" ]; then
              echo "Missing required file: $f"
              exit 1
            fi
          done

  app:
    name: App checks
    runs-on: ubuntu-latest
    # Belt and braces: the Vite config sets this too, but a runner defaulting to
    # UTC is exactly the environment in which the date-parsing defects go quiet.
    # Stated here so the job is honest about what it runs under.
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

      # Extended once e2e is scaffolded. See CONTRIBUTING.md / AGENTS.md for
      # the stack decisions this job enforces.
