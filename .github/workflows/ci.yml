name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  foundation:
    name: Foundation check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required repo files present
        run: |
          set -e
          for f in README.md LICENSE CONTRIBUTING.md CODE_OF_CONDUCT.md; do
            if [ ! -f "$f" ]; then
              echo "Missing required file: $f"
              exit 1
            fi
          done

  app:
    name: App checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

      # Extended once e2e is scaffolded. See CONTRIBUTING.md / AGENTS.md for
      # the stack decisions this job enforces.
