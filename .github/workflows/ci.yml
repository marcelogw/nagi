name: CI

# No secrets are used anywhere in this workflow, and none may be added to it.
# A fork's pull request runs with an empty secret context, so a job that needs
# one is a job outside contributors cannot pass — and a contribution that cannot
# pass CI is a contribution that does not arrive.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Required repo files present
        run: |
          set -e
          for f in README.md LICENSE CONTRIBUTING.md CODE_OF_CONDUCT.md; do
            if [ ! -f "$f" ]; then
              echo "Missing required file: $f"
              exit 1
            fi
          done

  app:
    name: App checks
    runs-on: ubuntu-latest
    # Belt and braces: the Vite config sets this too, but a runner defaulting to
    # UTC is exactly the environment in which the date-parsing defects go quiet.
    # Stated here so the job is honest about what it runs under.
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # One step, and the same one a contributor runs locally. Splitting it
      # into four is how the two drift until CI checks something nobody can
      # reproduce: lint, forbidden patterns, message catalogues, agent-file
      # parity, types, formatting.
      - run: npm run quality

      - run: npm run test

      - run: npm run build

      # After the build, because it measures what the build produced.
      - run: npm run check:bundle
