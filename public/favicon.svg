<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 4 56 32" fill="none" role="img" aria-label="Nagi">
  <!-- Same frozen geometry as src/components/shell/NagiMark.tsx (round 8, 2026-07-30).
       A favicon renders outside the document and cannot resolve CSS variables, so the
       brand blue is spelled out: #008097 is oklch(0.54 0.12 212), what primary points
       at in the light theme, and #1ca3b9 is oklch(0.66 0.11 212), the dark one.
       Re-derive both if the primary hue moves.
       Note: this file is parsed as strict XML, where a double hyphen cannot appear
       inside a comment. That is why token names are written without their prefix. -->
  <style>
    path { stroke: #008097 }
    @media (prefers-color-scheme: dark) { path { stroke: #1ca3b9 } }
  </style>
  <path d="M4 24C9.4 24 9.4 11 14.6 11C19.87 11 24.47 32 30 32C33.2 32 36.3 19 39.1 19C41.35 19 41.35 24 42.82 24L52 24"
        stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
